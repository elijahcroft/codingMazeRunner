<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Cycles — Big Screen</title>
<style>
  /* Projector view: big arena, readable names, nothing to type but the key. */
  :root {
    color-scheme: dark;
    --void: #080c16;
    --chrome: #0d1322;
    --line: #2a3852;
    --text: #e8eef8;
    --muted: #8fa0ba;
    --cyan: #55dfd2;
    --amber: #f4c95d;
    --red: #ff6577;
    --green: #72e09d;
    --editor: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--void); color: var(--text); font-family: Inter, "Segoe UI", Arial, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  button, input { font: inherit; }
  button { cursor: pointer; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: #080d18; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; }
  .logo-mark { color: var(--void); background: var(--cyan); font: 900 15px var(--editor); padding: 5px 8px; }
  .round { font: 700 18px var(--editor); color: var(--amber); }
  .address { color: var(--muted); font: 15px var(--editor); }
  .address b { color: var(--cyan); }
  .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .controls input { width: 90px; border: 1px solid var(--line); background: #090e19; color: var(--text); padding: 8px 10px; }
  .btn { border: 1px solid #397f7a; background: #173d40; color: #dffffb; padding: 9px 14px; font-weight: 700; }
  .btn:hover { background: #205157; }
  .btn.primary { background: var(--cyan); color: #062b2c; border-color: var(--cyan); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .msg { color: var(--red); font: 13px var(--editor); }

  main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; padding: 16px; background: #0b111e; }
  canvas { display: block; background: #050912; border: 1px solid #31405b; }
  .waiting { text-align: center; max-width: 900px; }
  .waiting h1 { font-size: clamp(44px, 6vw, 90px); letter-spacing: -.05em; margin: 0 0 12px; }
  .waiting p { color: var(--muted); font-size: 22px; margin: 0 0 22px; }
  .join-at { color: var(--muted); font-size: 26px; margin: 0 0 18px; }
  .join-at b { color: var(--cyan); font: 700 clamp(30px, 3.6vw, 52px) var(--editor); display: block; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; font-size: 20px; }
  .chips span, .rider { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(8,12,22,.92); border: 2px solid var(--amber); padding: 26px 46px; text-align: center; box-shadow: 0 20px 80px rgba(0,0,0,.6); }
  .banner small { display: block; color: var(--amber); font: 700 16px var(--editor); letter-spacing: .1em; margin-bottom: 8px; }
  .banner b { display: block; font-size: clamp(36px, 5vw, 72px); letter-spacing: -.04em; }
  .banner span { color: var(--muted); font-size: 18px; }
  .countdown { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font: 900 clamp(120px, 22vw, 260px) var(--editor); color: var(--amber); text-shadow: 0 0 40px rgba(0,0,0,.9), 0 8px 0 rgba(0,0,0,.6); }
  .final { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); background: rgba(8,12,22,.9); border: 2px solid var(--amber); padding: 8px 22px; font-size: 26px; font-weight: 800; white-space: nowrap; }
  .final small { color: var(--amber); font: 700 14px var(--editor); letter-spacing: .1em; margin-right: 10px; }

  aside { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: var(--chrome); }
  .heading { padding: 12px 16px; color: var(--muted); font: 12px var(--editor); letter-spacing: .08em; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .list { padding: 8px 16px 14px; display: grid; gap: 6px; font-size: 17px; }
  .rider { min-width: 0; white-space: nowrap; overflow: hidden; }
  .rider.out { opacity: .4; text-decoration: line-through; }
  /* A big class: two columns so the whole list fits on the screen. */
  .list.many { grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 15px; }
  .list.many .season-row { font-size: 14px; grid-template-columns: 20px 10px minmax(0, 1fr) auto; gap: 6px; }
  .rider small { margin-left: auto; color: var(--muted); font: 12px var(--editor); text-decoration: none; }
  .feed { padding: 8px 16px 14px; display: grid; gap: 6px; font-size: 15px; line-height: 1.35; max-height: 34vh; overflow: auto; }
  .feed div b { font-weight: 800; }
  .feed .turn { color: var(--muted); font: 11px var(--editor); }
  .season-row { display: grid; grid-template-columns: 26px 12px minmax(0, 1fr) auto; gap: 9px; align-items: center; font-size: 16px; }
  .season-row .rank { color: var(--muted); font: 13px var(--editor); }
  .season-row .pts { font: 700 15px var(--editor); }
  .season-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-mark">LC</span>Light Cycles</div>
  <div class="round" id="round"></div>
  <div class="address">Students: <b id="address"></b></div>
  <div class="controls">
    <span class="msg" id="msg"></span>
    <input id="key" type="password" placeholder="admin key" aria-label="Admin key">
    <button class="btn primary" id="startButton">▶ Start round</button>
    <button class="btn ghost" id="skipButton" hidden>▸▸ Skip</button>
    <button class="btn ghost" id="resetButton">Reset season</button>
  </div>
</header>
<main>
  <section class="stage" id="stage">
    <div class="waiting" id="waiting">
      <h1>Bots on the grid</h1>
      <div class="join-at">Join at <b id="joinAt"></b></div>
      <p id="waitingText">Waiting for riders. Each student's latest test drive is their entry.</p>
      <div class="chips" id="chips"></div>
    </div>
    <canvas id="arena" hidden></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="countdown" id="countdown" hidden></div>
    <div class="final" id="final" hidden></div>
  </section>
  <aside>
    <div class="heading"><span>RIDERS</span><span id="aliveCount"></span></div>
    <div class="list" id="riders"><div class="empty">The riders appear when a round starts.</div></div>
    <div class="heading"><span>CRASH FEED</span></div>
    <div class="feed" id="feed"><div class="empty">Nothing yet.</div></div>
    <div class="heading"><span>SEASON POINTS</span><span>1 per rider outlasted</span></div>
    <div class="list" id="season"></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];   // up, right, down, left
let match = null, frame = 0, timer = null, board = [];

function esc(value) {
  return String(value).replace(/[&<>\"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}
function store(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
function who(b) { return `<b style="color:${esc(b.color)}">${esc(b.name)}</b>`; }

function renderSeason() {
  $("season").classList.toggle("many", board.length > 14);
  $("season").innerHTML = board.length ? board.map((row, i) => `
    <div class="season-row"><span class="rank">${i + 1}</span><span class="dot" style="background:${esc(row.color)}"></span>
      <span class="name">${esc(row.name)}</span><span class="pts">${row.points}</span></div>`).join("")
    : '<div class="empty">No points yet.</div>';
  if (!match) {
    $("waitingText").textContent = board.length
      ? `${board.length} bot${board.length === 1 ? "" : "s"} entered. Students keep improving until you press Start.`
      : "Waiting for riders. Each student's latest test drive is their entry.";
    $("chips").innerHTML = board.map(row => `<span><span class="dot" style="background:${esc(row.color)}"></span>${esc(row.name)}</span>`).join("");
  }
}
async function refresh() {
  if (timer) return;
  try {
    const data = await (await fetch("/cycles/board")).json();
    board = data.board;
    $("address").textContent = $("joinAt").textContent = data.address.replace(/^http:\/\//, "");
    // The round on screen, or in the lobby the one Start will run.
    $("round").textContent = match ? `Round ${match.round}` : `Next: round ${data.round + 1}`;
    renderSeason();
  } catch (_) {}
}

// Which way a cycle faces after `steps` moves: 0 up, 1 right, 2 down, 3 left.
// Newer servers send "dirs"; otherwise its last step tells us, or its start.
function heading(b, steps) {
  if (b.dirs && b.dirs[steps] != null) return b.dirs[steps];
  if (steps === 0) return b.dir;
  const [r0, c0] = b.path[steps - 1], [r1, c1] = b.path[steps];
  return DIRS.findIndex(([dr, dc]) => dr === r1 - r0 && dc === c1 - c0);
}
// A white head with a dark arrow pointing the way the cycle is going.
function drawHead(ctx, r, c, size, d, color) {
  ctx.shadowColor = color; ctx.shadowBlur = size * 1.5;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(c * size, r * size, size, size);
  ctx.shadowBlur = 0;
  const [dr, dc] = DIRS[d], x = (c + .5) * size, y = (r + .5) * size, k = size * .4;
  ctx.fillStyle = "#050912";
  ctx.beginPath();
  ctx.moveTo(x + dc * k, y + dr * k);
  ctx.lineTo(x - dc * k * .6 + dr * k, y - dr * k * .6 - dc * k);
  ctx.lineTo(x - dc * k * .6 - dr * k, y - dr * k * .6 + dc * k);
  ctx.fill();
}
function draw(t) {
  const canvas = $("arena"), stage = $("stage");
  const rows = match.grid.length, cols = match.grid[0].length;
  const size = Math.max(4, Math.floor(Math.min((stage.clientWidth - 32) / cols, (stage.clientHeight - 32) / rows)));
  canvas.width = cols * size; canvas.height = rows * size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#0b111e"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#26334a";
  match.grid.forEach((line, r) => { for (let c = 0; c < cols; c++) if (line[c] === "#") ctx.fillRect(c * size, r * size, size, size); });
  const heads = [];
  for (const b of match.bikes) {
    const out = b.died !== null && b.died <= t;
    const steps = Math.min(t, b.path.length - 1);
    ctx.globalAlpha = out ? .3 : .85;
    ctx.fillStyle = b.color;
    const gap = size >= 8 ? 1 : 0;   // tiny cells look like dotted lines with gaps
    for (let k = 0; k <= steps; k++) ctx.fillRect(b.path[k][1] * size + gap, b.path[k][0] * size + gap, size - 2 * gap, size - 2 * gap);
    ctx.globalAlpha = 1;
    const [hr, hc] = b.path[steps];
    if (out) {
      const [xr, xc] = b.crash || [hr, hc];
      ctx.strokeStyle = "#ff6577"; ctx.lineWidth = Math.max(2, size / 4);
      ctx.beginPath();
      ctx.moveTo(xc * size + 1, xr * size + 1); ctx.lineTo((xc + 1) * size - 1, (xr + 1) * size - 1);
      ctx.moveTo((xc + 1) * size - 1, xr * size + 1); ctx.lineTo(xc * size + 1, (xr + 1) * size - 1);
      ctx.stroke();
    } else {
      drawHead(ctx, hr, hc, size, heading(b, steps), b.color);
      heads.push([b, hr, hc]);
    }
  }
  // Name tags over the riders still in, so the room can cheer for someone.
  // Tiny cells with lots of riders would be mush, so tags wait until the
  // field thins out, and a tag that would cover another one is skipped.
  const final = finalTwo(t);
  if (final) for (const [b, hr, hc] of heads) {
    const pulse = 1 + .5 * Math.abs(Math.sin(t / 3));
    ctx.strokeStyle = "#f4c95d"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc((hc + .5) * size, (hr + .5) * size, size * (1.1 + pulse), 0, 2 * Math.PI); ctx.stroke();
  }
  if (size < 10 && heads.length > 12) return;
  const px = final ? 26 : Math.max(15, Math.min(22, Math.round(size * 1.1)));
  ctx.font = `700 ${px}px Inter, Arial, sans-serif`;
  ctx.textAlign = "center";
  const placed = [];
  for (const [b, hr, hc] of heads) {
    const x = hc * size + size / 2, y = Math.max(px, hr * size - 4);
    const w = ctx.measureText(b.name).width + 6, box = [x - w / 2, y - px, x + w / 2, y + 2];
    if (placed.some(o => box[0] < o[2] && o[0] < box[2] && box[1] < o[3] && o[1] < box[3])) continue;
    placed.push(box);
    ctx.lineWidth = 5; ctx.strokeStyle = "#050912"; ctx.strokeText(b.name, x, y);
    ctx.fillStyle = b.color; ctx.fillText(b.name, x, y);
  }
}
const isOut = (b, t) => b.died !== null && b.died <= t;
// The last two riders of a bigger round, or null.
function finalTwo(t) {
  const left = match.bikes.filter(b => !isOut(b, t));
  return match.bikes.length > 2 && left.length === 2 ? left : null;
}
// Code errors stay private: the student's own page has the details.
function crashText(b) {
  return b.error || /^💥/.test(b.cause) ? "had a code error. Check your console!" : esc(b.cause);
}
function renderRiders(t) {
  const lasted = b => b.died === null || b.died > t ? Infinity : b.died;
  const order = [...match.bikes].sort((a, b) => lasted(b) - lasted(a) || a.name.localeCompare(b.name));
  const alive = order.filter(b => lasted(b) === Infinity).length;
  $("aliveCount").textContent = `${alive} of ${match.bikes.length} riding`;
  $("riders").classList.toggle("many", match.bikes.length > 14);
  $("riders").innerHTML = order.map(b => {
    const out = lasted(b) !== Infinity;
    return `<div class="rider${out ? " out" : ""}"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}${out ? `<small>turn ${b.died}</small>` : ""}</div>`;
  }).join("");
}
function addCrashes(t) {
  const crashed = match.bikes.filter(b => b.died === t);
  if (!crashed.length) return;
  if ($("feed").querySelector(".empty")) $("feed").innerHTML = "";
  const html = crashed.map(b => `<div><span class="turn">turn ${t}</span> ${who(b)} ${crashText(b)}</div>`).join("");
  $("feed").insertAdjacentHTML("afterbegin", html);
}
function finish() {
  clearTimeout(timer); timer = null;
  $("skipButton").hidden = true;
  $("countdown").hidden = true;
  $("final").hidden = true;
  $("startButton").disabled = false;
  draw(match.turns); renderRiders(match.turns);
  const winners = match.bikes.filter(b => b.place === 1);
  const names = winners.map(who).join(" & ");
  const how = winners.length === 1 ? (winners[0].died === null ? "last cycle riding" : "lasted longest")
    : winners.every(b => b.died === null) ? "time's up: they share the win" : "tie: they went out on the same turn";
  $("banner").innerHTML = `<small>ROUND ${match.round}</small><b>🏆 ${names}</b><span>${how} · ${match.turns} turns</span>`;
  $("banner").hidden = false;
  renderSeason();
}
function play() {
  $("waiting").hidden = true;
  $("arena").hidden = false;
  $("banner").hidden = true;
  $("feed").innerHTML = '<div class="empty">Nothing yet.</div>';
  $("skipButton").hidden = false;
  frame = 0;
  draw(0); renderRiders(0);
  // Long enough to cheer, short enough to run lots of rounds: about 20 s.
  // Two careful bots can circle for ages, so the final two go 4x faster.
  const delay = Math.max(30, Math.min(110, 20000 / Math.max(1, match.turns)));
  const tick = () => {
    draw(frame); renderRiders(frame); addCrashes(frame);
    const final = finalTwo(frame);
    $("final").hidden = !final;
    if (final) $("final").innerHTML = `<small>FINAL TWO</small>${who(final[0])} vs ${who(final[1])}`;
    if (frame++ < match.turns) timer = setTimeout(tick, final ? Math.max(10, delay / 4) : delay);
    else finish();
  };
  // 3, 2, 1 over the starting grid, so everyone finds their cycle first.
  let count = 3;
  const countdown = () => {
    $("countdown").hidden = count === 0;
    $("countdown").textContent = count;
    timer = setTimeout(count-- ? countdown : tick, count >= 0 ? 800 : 0);
  };
  countdown();
}
function skip() {
  for (let t = frame; t <= match.turns; t++) addCrashes(t);
  frame = match.turns + 1;
  finish();
}
async function start() {
  const key = $("key").value.trim();
  if (!key) { $("msg").textContent = "Type the admin key first."; $("key").focus(); return; }
  store("cyclesKey", key);
  $("msg").textContent = "";
  $("startButton").disabled = true;
  try {
    const response = await fetch("/cycles/battle", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key})});
    const data = await response.json();
    if (data.error) { $("msg").textContent = data.error; $("startButton").disabled = false; return; }
    match = data.replay; board = data.board;
    $("round").textContent = `Round ${match.round}`;
    play();
  } catch (_) {
    $("msg").textContent = "The server did not respond.";
    $("startButton").disabled = false;
  }
}
async function resetSeason() {
  const key = $("key").value.trim();
  if (!key) { $("msg").textContent = "Type the admin key first."; $("key").focus(); return; }
  if (!confirm("Start a new season? Every student's points go back to 0, and each bot enters again with its next Test drive.")) return;
  let data;
  try { data = await (await fetch("/admin", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key, action: "cycles_reset"})})).json(); }
  catch (_) { $("msg").textContent = "The server did not respond."; return; }
  $("msg").textContent = data.error || "";
  if (data.error) return;
  // Stop a round that's still playing, so Start works again straight away.
  clearTimeout(timer); timer = null; match = null;
  for (const id of ["arena", "banner", "final", "countdown", "skipButton"]) $(id).hidden = true;
  $("startButton").disabled = false;
  $("waiting").hidden = false;
  await refresh();
}

$("key").value = recall("cyclesKey") || "";
$("startButton").addEventListener("click", start);
$("skipButton").addEventListener("click", skip);
$("resetButton").addEventListener("click", resetSeason);
window.addEventListener("resize", () => { if (match && !timer) draw(match.turns); });
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
