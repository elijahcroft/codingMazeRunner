<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pals Hang out</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: linear-gradient(#e9f4ee, #f6f1e2); color: #2c5352; font: 800 18px/1.3 ui-rounded, "Nunito", system-ui, "Segoe UI", Roboto, sans-serif; }
  .page { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 290px; grid-template-rows: auto minmax(0, 1fr); gap: 14px; padding: 14px; }
  .meter-row { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 8px 18px; background: #fffdf6; border-radius: 18px; font-size: 22px; }
  .track { height: 20px; background: #e8efe4; border-radius: 10px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; border-radius: 10px; background: linear-gradient(90deg, #ff9fb5, #ffd27a, #8fd0c8); transition: width .5s ease; }
  #next { font-size: 18px; color: #7a6a40; }
  .room { min-height: 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; }
  .world { flex: none; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .cam { display: flex; gap: 6px; align-items: center; }
  .cam button, #people button { font: inherit; color: inherit; border: 0; border-radius: 12px; background: #fffdf6; padding: 8px 12px; cursor: pointer; }
  .cam button[aria-pressed="true"], #people button[aria-pressed="true"] { background: #ffd27a; }
  #map { position: relative; height: 66px; display: flex; border-radius: 14px; overflow: hidden; cursor: pointer; background: #fffdf6; }
  #map .place { flex: 1; padding: 3px 8px; font-size: 13px; color: #5f7c75; border-left: 2px solid #e8efe4; }
  #map .view { position: absolute; top: 0; bottom: 0; background: #ffd27a55; border: 2px solid #f5b83d; border-radius: 10px; pointer-events: none; }
  #map .who { position: absolute; bottom: 5px; transform: translateX(-50%); padding: 0 6px; background: #2c5352; color: #fffdf6; border-radius: 8px; font-size: 13px; white-space: nowrap; }
  #camWord { font-size: 15px; color: #5f7c75; white-space: nowrap; }
  #people { display: flex; flex-direction: column; gap: 4px; max-height: 44vh; overflow: auto; }
  #people button { display: grid; text-align: left; background: #eef4e8; padding: 4px 10px; font-size: 16px; line-height: 1.15; }
  #people small { font-size: 13px; font-weight: 700; color: #5f7c75; }
  #places { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  #places button { font: inherit; font-size: 14px; color: inherit; border: 0; border-radius: 12px; background: #eef4e8; padding: 4px 10px; cursor: pointer; }
  #places button[aria-pressed="true"] { background: #ffd27a; }
  #placeTag { position: absolute; left: 14px; top: 12px; padding: 4px 14px; background: #fffdf6ee; border-radius: 14px; font-size: clamp(16px, 1.8vw, 26px); pointer-events: none; }
  .screen { position: relative; aspect-ratio: 16 / 9; border-radius: 26px; overflow: hidden; background: #bfe3dc; box-shadow: 0 8px 28px #2c535233; }
  .screen canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #stage { image-rendering: pixelated; cursor: grab; touch-action: none; }
  .tag { position: absolute; transform: translateX(-50%); padding: 0 8px; background: #fffdf6e8; color: #2c5352; border-radius: 9px; font-size: clamp(12px, 1.3vw, 18px); pointer-events: none; white-space: nowrap; }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 46%; padding: 6px 14px; background: #fff; color: #2c5352; border-radius: 16px; box-shadow: 0 3px 12px #2c535240; font-size: clamp(16px, 2vw, 30px); line-height: 1.2; text-align: center; overflow-wrap: anywhere; }
  .float { position: absolute; transform: translate(-50%, 0); font-size: clamp(20px, 2.4vw, 34px); font-weight: 900; color: #fff; text-shadow: 0 1px 0 #2c5352, 0 0 4px #2c5352; pointer-events: none; animation: up 1.4s ease-out forwards; }
  .float.combo { color: #ffd93b; font-size: clamp(30px, 4vw, 54px); }
  @keyframes up { to { transform: translate(-50%, -80px); opacity: 0; } }
  #banner { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); max-width: 90%; padding: 8px 24px; background: #fffdf6f2; border-radius: 20px; font-size: clamp(20px, 2.4vw, 36px); white-space: nowrap; }
  #banner.big { top: 24%; padding: 18px 44px; text-align: center; font-size: clamp(36px, 5vw, 76px); font-weight: 900; color: #d9477e; }
  #banner small { display: block; font-size: .42em; color: #2c5352; }
  #closed { position: absolute; inset: 0; display: grid; place-items: center; background: #fffdf6e0; font-size: 34px; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: #fffdf6; border-radius: 18px; padding: 12px 14px; }
  .label { margin: 0 0 4px; font-size: 14px; color: #5f7c75; }
  .address { font-size: 19px; color: #d9477e; overflow-wrap: anywhere; }
  #feed { margin: 0; padding: 0; list-style: none; font-size: 15px; font-weight: 700; overflow: hidden; flex: 1; }
  #feed li { margin-bottom: 5px; }
  #raceCard { background: #f3ecff; color: #3b1f6b; }
  #raceCard[hidden] { display: none; }
  #raceJob { font-size: 22px; font-weight: 900; line-height: 1.2; }
  #raceCode { margin: 6px 0 0; padding: 8px 10px; border-radius: 12px; background: #27303f; color: #e9f1e2; font: 700 18px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
  #raceCode[hidden] { display: none; }
  #raceWho { margin-top: 6px; font-size: 16px; font-weight: 700; }
  #jobs { display: grid; gap: 2px; font-size: 16px; }
</style>
</head>
<body>
<div class="page">
  <div class="meter-row"><span>🎉 Class party</span><div class="track"><i id="bar"></i></div><span id="words"></span><span id="next"></span></div>
  <section class="room"><div class="screen" id="host"><canvas id="back" aria-hidden="true"></canvas><canvas id="stage" aria-label="Everyone's pals, hanging out"></canvas>
    <div id="placeTag" hidden></div><div id="banner" hidden></div><div id="closed" hidden>The Hang out is closed for now.</div></div>
    <div class="world">
      <div class="cam"><button id="camLeft" aria-label="Move the camera left">◀</button><button id="camRight" aria-label="Move the camera right">▶</button><button id="camAuto">🎬 Auto</button></div>
      <div id="map" aria-label="Map of the world. Click to move the camera."></div>
      <span id="camWord"></span>
    </div></section>
  <aside class="side">
    <div class="card"><p class="label">Join in at</p><div class="address" id="address"></div></div>
    <div class="card" id="raceCard" hidden><p class="label" id="raceLabel">💻 Code race</p><div id="raceJob"></div><pre id="raceCode" hidden></pre><div id="raceWho"></div></div>
    <div class="card"><p class="label">Look at</p><div id="places"></div><p class="label">Who's here (click to follow)</p><div id="people"></div></div>
    <div class="card" id="jobsCard" hidden><p class="label">🎯 Today's jobs (all 3 open a 🎁)</p><div id="jobs"></div></div>
    <div class="card" style="flex:1;min-height:0;display:flex;flex-direction:column"><p class="label">Just now</p><ul id="feed"></ul></div>
  </aside>
</div>
<script src="/pixel/art.js"></script>
<script src="/pixel/rig.js"></script>
<script src="/pixel/stage.js"></script>
<script src="/pixel/hangout.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));
const stage = PalStage.create($("stage"), $("host"));
const PIP = {size: 16, speed: 4, palette: ["#1b1530", "#ff8fc7"], names: [], frames: [Array.from(
  PixelArt.fromRows(PixelArt.STARTERS.Bean), n => n < 0 ? "." : n === PixelArt.INK ? "0" : "1").join("")]};

function fit() {
  const room = document.querySelector(".room").getBoundingClientRect();
  $("host").style.width = Math.floor(Math.min(room.width, (room.height - 80) * 16 / 9)) + "px";
}
new ResizeObserver(fit).observe(document.querySelector(".room"));

let bannerTimer = 0;
function banner(html, ms, big) {
  $("banner").innerHTML = html;
  $("banner").className = big ? "big" : "";
  $("banner").hidden = false;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { $("banner").hidden = true; }, ms);
}
stage.setPal(PIP);
stage.fresh();
stage.state.visible = false;
stage.state.soft = true;
stage.state.scene = "park";
stage.roomHooks({everySound: true});

// ---- The camera: Auto goes to whoever's up to something, or you can drive -------------------
const PLACE_W = PalStage.W, PLACE_WORD = {home: "🏠 Home", park: "🌳 Park", wedding: "💒 Wedding", beach: "🏖️ Beach", night: "🌙 Night", snowy: "⛄ Snowy hill", candy: "🍭 Candy land", space: "🚀 Space"};
const cam = {mode: "auto", seat: null, x: 0, moveOn: 0, loc: 0};
let people = [], homeName = "", watcher = null, game = null;
// Which place the screen shows: 0 is outside, any other number is someone's home.
function lookAt(loc) {
  if (loc === cam.loc) return;
  cam.loc = loc;
  if (!loc) cam.x = 0;
  if (watcher) watcher.now();
}
const crew = () => stage.state.room || [];
const worldWide = () => (stage.state.places || ["park"]).length * PLACE_W;
const keepIn = x => Math.max(0, Math.min(worldWide() - PLACE_W, x));
stage.state.camera = () => {
  const who = cam.mode !== "free" && crew().find(m => m.seat === cam.seat);
  return who ? who.x - PLACE_W / 2 : cam.x;
};
function drive(x) { cam.mode = "free"; cam.x = keepIn(x); paintWorld(); }
function followSeat(seat) {
  const m = people.find(m => m.seat === seat);
  cam.mode = "follow"; cam.seat = seat;
  if (m) lookAt(m.loc);
  paintWorld();
}
function goAuto() { cam.mode = "auto"; cam.moveOn = 0; paintWorld(); }
// Auto takes turns with everyone, inside the homes too.
function autoLook(now) {
  if (cam.mode !== "auto" || !people.length) return;
  if (game && game.phase === "playing" && (game.kind === "tag" || game.kind === "hide") && people.some(m => m.seat === game.it)) {
    cam.seat = game.it;     // a chase is best watched from the chaser
    lookAt(0);
    return;
  }
  if (now < cam.moveOn) return;
  const at = people.findIndex(m => m.seat === cam.seat), next = people[(at + 1) % people.length];
  cam.seat = next.seat;
  lookAt(next.loc);
  cam.moveOn = now + 8000;
}
const SHOW_THESE = ["mymove", "toy", "five", "found", "go", "rest", "move", "fx"];
function autoNotice(e) {
  const now = performance.now();
  if (cam.mode !== "auto" || !SHOW_THESE.includes(e.kind) || now < cam.moveOn - 5000) return;     // at least 3 seconds on each person
  cam.seat = e.seat;
  cam.moveOn = now + 8000;
}
// Names on the map, left to right. One that would sit on the name before it goes up a row.
function mapNames(list, wide) {
  const px = $("map").clientWidth || 1, rows = [-1e9, -1e9];
  return list.slice().sort((a, b) => a.x - b.x).map(m => {
    const at = Math.max(2, Math.min(98, m.x / wide * 100)), half = (m.name.length * 7 + 14) / px * 50;
    const row = rows[0] <= at - half ? 0 : rows[1] <= at - half ? 1 : rows[0] < rows[1] ? 0 : 1;
    rows[row] = at + half;
    return `<span class="who" style="left:${at}%;bottom:${5 + row * 18}px">${esc(m.name)}</span>`;
  }).join("");
}
function paintWorld() {
  const places = stage.state.places || ["park"], wide = worldWide(), left = stage.state.camX || 0, list = crew();
  $("map").innerHTML = places.map(p => `<div class="place">${p === "home" ? `🏠 ${esc(homeName)}'s home` : PLACE_WORD[p]}</div>`).join("") +
    `<div class="view" style="left:${left / wide * 100}%;width:${PLACE_W / wide * 100}%"></div>` +
    mapNames(list, wide);
  $("people").innerHTML = people.map(m => `<button data-seat="${m.seat}" aria-pressed="${cam.mode === "follow" && cam.seat === m.seat}"><span>${esc(m.name)}</span>
    <small>${m.loc ? esc(m.where) : PLACE_WORD[m.where] || ""}${m.doing ? " · " + esc(m.doing) : ""}</small></button>`).join("") || "Nobody yet";
  const homes = [...new Map(people.filter(m => m.loc).map(m => [m.loc, m.home])).entries()];
  $("places").innerHTML = `<button data-loc="0" aria-pressed="${!cam.loc}">🌳 Outside (${people.filter(m => !m.loc).length})</button>` +
    homes.map(([loc, name]) => `<button data-loc="${loc}" aria-pressed="${cam.loc === loc}">🏠 ${esc(name)} (${people.filter(m => m.loc === loc).length})</button>`).join("");
  $("placeTag").hidden = !cam.loc;
  $("placeTag").textContent = cam.loc ? `🏠 ${homeName}'s home` : "";
  $("camAuto").setAttribute("aria-pressed", cam.mode === "auto");
  const who = list.find(m => m.seat === cam.seat);
  $("camWord").textContent = cam.mode === "free" ? "You're driving" : who ? `Watching ${who.name}` : "";
}
setInterval(() => { autoLook(performance.now()); paintWorld(); }, 250);
$("camLeft").addEventListener("click", () => drive((stage.state.camX || 0) - PLACE_W / 2));
$("camRight").addEventListener("click", () => drive((stage.state.camX || 0) + PLACE_W / 2));
$("camAuto").addEventListener("click", goAuto);
$("map").addEventListener("pointerdown", e => {
  const r = $("map").getBoundingClientRect();
  drive((e.clientX - r.left) / r.width * worldWide() - PLACE_W / 2);
});
$("people").addEventListener("pointerdown", e => { const b = e.target.closest("[data-seat]"); if (b) followSeat(+b.dataset.seat); });
$("places").addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-loc]");
  if (!b) return;
  lookAt(+b.dataset.loc);
  cam.mode = "free"; cam.x = 0;
  paintWorld();
});
let dragFrom = null;
$("stage").addEventListener("pointerdown", e => { dragFrom = {px: e.clientX, x: stage.state.camX || 0}; $("stage").setPointerCapture(e.pointerId); });
$("stage").addEventListener("pointermove", e => {
  if (dragFrom) drive(dragFrom.x - (e.clientX - dragFrom.px) / $("stage").getBoundingClientRect().width * PLACE_W);
});
$("stage").addEventListener("pointerup", () => { dragFrom = null; });
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") drive((stage.state.camX || 0) + (e.key === "ArrowLeft" ? -80 : 80));
});
PalHang.start($("back"), () => stage.state);
watcher = PalStage.follow(stage, {everySound: true, loc: () => cam.loc, onState(data) {
  people = data.people || [];
  homeName = data.home ? data.home.name : "";
  if (cam.loc && !people.some(m => m.loc === cam.loc)) lookAt(0);     // everyone left that home
  $("closed").hidden = data.open;
  $("bar").style.width = Math.min(100, data.meter.points / data.meter.goal * 100) + "%";
  $("words").textContent = `${data.meter.points} of ${data.meter.goal}`;
  $("next").textContent = data.meter.next ? `Next: ${data.meter.next}` : "Next: a party!";
  game = data.game;
  paintGame(data.game);
  const jobs = (data.class_jobs || []).map(([icon, words]) => `<span>${icon} ${esc(words)}</span>`).join("");
  $("jobsCard").hidden = !jobs || !data.open;
  if ($("jobs").innerHTML !== jobs) $("jobs").innerHTML = jobs;
  for (const e of data.events) {
    autoNotice(e);
    if (e.kind === "mymove") banner(`✨ <b>${esc(e.by)}</b>: ${esc(e.title)}`, e.ms + 700);
    else if (e.kind === "party") banner(`🎉 CLASS PARTY! 🎉${e.reward ? `<small>New for everyone: ${esc(e.reward.name)}</small>` : ""}`, 6000, true);
    else if (e.kind === "shower") banner("🌠 Star shower!", 3500);
  }
}});

// The game on now. A Code race shows the job, then the fastest code between rounds, so the class can read it together.
const GAME_WORD = {hide: "🙈 Hide & seek", tag: "🏃 Tag", race: "🚦 Red light, green light", dance: "💃 Copy the dance", code: "💻 Code race"};
const DANCE_ICON = {wave: "👋", jump: "🦘", spin: "🌀", cheer: "🎉"};
function paintGame(g) {
  $("raceCard").hidden = !g;
  if (!g) return;
  const name = seat => (people.find(m => m.seat === seat) || {}).name || "A friend";
  if (g.kind !== "code") {
    const left = Math.max(0, Math.ceil(g.until - g.now)), names = seats => seats.map(name).join(", ") || "nobody yet";
    $("raceLabel").textContent = GAME_WORD[g.kind] + (g.phase === "lobby" || g.phase === "results" ? "" : ` · ${left}s left`);
    $("raceJob").textContent = g.phase === "lobby" ? `Starting soon! ${g.joined.length} joined. Join in Games.`
      : g.phase === "results" ? g.message
      : g.kind === "tag" ? `${name(g.it)} is IT!`
      : g.kind === "hide" ? (g.phase === "hiding" ? `${name(g.it)} is counting. Hide!` : `${name(g.it)} is looking!`)
      : g.kind === "race" ? (g.light === "red" ? "🔴 Red light: freeze!" : "🟢 Green light: run!")
      : `Round ${g.round + 1} of 3: ${(g.seq || []).map(m => DANCE_ICON[m] || m).join(" ")}`;
    $("raceCode").hidden = true;
    $("raceWho").textContent = g.phase !== "playing" && g.phase !== "hiding" ? ""
      : g.kind === "hide" && g.phase === "playing" ? `Found: ${names(g.found)} (${g.found.length} of ${g.joined.length - 1})`
      : g.kind === "race" ? `At the flag: ${names(g.done)}`
      : `Playing: ${g.joined.length}`;
    return;
  }
  const reveal = g.phase === "playing" && g.pause && g.reveal;
  $("raceLabel").textContent = g.phase === "playing" ? `💻 Code race · Job ${g.round + 1} of ${g.rounds}` : "💻 Code race";
  $("raceJob").textContent = g.phase === "lobby" ? `Starting soon! ${g.joined.length} joined. Join in Games.`
    : g.phase === "results" ? g.message
    : reveal ? (reveal.by ? `⚡ ${reveal.by} was fastest!` : "Here's one way:") : `${g.job.job} ${g.job.icons}`;
  $("raceCode").hidden = !reveal;
  $("raceCode").textContent = reveal ? reveal.code : "";
  $("raceWho").textContent = g.phase === "playing" ? `Solved: ${g.solved.map(s => name(s) + ((g.bonus || []).includes(s) ? " 🌟" : "")).join(", ") || "nobody yet"} (${g.solved.length} of ${g.joined.length})` : "";
}

async function refresh() {
  const over = await fetch("/pixel/overview").then(r => r.json()).catch(() => null);
  if (!over) return;
  $("address").textContent = over.address;
  $("feed").innerHTML = over.feed.slice().reverse().map(f => `<li>${esc(f.text)}</li>`).join("");
}
setInterval(refresh, 4000);
refresh();
</script>
</body>
</html>
