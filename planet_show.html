<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strange Planet — Class Expedition</title>
<style>
  /* For the projector: the class's stars filling one meter together, the
     moments as they happen, and everyone's rover. Big, calm, readable. */
  :root {
    color-scheme: dark;
    --sky: #1b1733; --dusk: #231d3f; --panel: #2c2550; --edge: #463c78;
    --bone: #f2eadb; --haze: #a89ec8; --mint: #8cf2c6; --amber: #ffb547; --gold: #ffd36b; --violet: #b9a3ff;
    --ui: system-ui, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 70% -10%, #4a2f63, var(--sky) 60%); color: var(--bone); font: 18px/1.4 var(--ui); padding: clamp(16px, 3vw, 40px); }
  h1 { margin: 0; font-size: clamp(34px, 5vw, 64px); font-weight: 850; letter-spacing: -.04em; line-height: 1; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
  header p { margin: 0; color: var(--haze); font-size: clamp(16px, 1.6vw, 22px); }
  header b { color: var(--bone); font-family: var(--mono); }
  .meter { position: relative; height: 34px; border-radius: 17px; background: var(--dusk); box-shadow: inset 0 0 0 1px var(--edge); margin: 0 0 54px; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 17px; background: linear-gradient(90deg, #ffb547, #ff8a7a 50%, #b9a3ff); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .goal { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--bone); border-radius: 2px; }
  .goal span { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 15px; color: var(--haze); }
  .goal.done span { color: var(--mint); }
  .unlock { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 5; display: grid; gap: 10px; text-align: center; padding: 34px 54px; border-radius: 28px; background: rgba(27,21,52,.96); box-shadow: 0 20px 80px rgba(0,0,0,.6), inset 0 0 0 3px var(--gold, #ffd36b); }
  .unlock[hidden] { display: none; }
  .unlock b { font-size: 64px; color: #ffd36b; }
  .unlock span { font-size: 30px; color: #f2eadb; max-width: 900px; }
  header p { margin-top: 10px; }
  .total { text-align: right; font: 800 clamp(44px, 6vw, 80px)/1 var(--ui); color: var(--gold); letter-spacing: -.03em; }
  .total small { display: block; font: 500 16px var(--ui); color: var(--haze); letter-spacing: 0; margin-top: 4px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
  h2 { margin: 0 0 12px; font-size: 20px; color: var(--haze); font-weight: 650; }
  .fleet { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .ship { background: rgba(35,29,63,.8); border-radius: 16px; padding: 12px; border: 2px solid transparent; min-width: 0; }
  .ship.won { border-color: var(--mint); }
  .ship .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ship .top canvas { width: 58px; height: 58px; flex: none; margin: -8px 0; }
  .ship b { flex: 1; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ship .where { color: var(--haze); font: 13px var(--mono); white-space: nowrap; }
  .ship .map { display: block; margin: 0 auto 8px; border-radius: 6px; }
  .ship pre { background: #15112a; border-radius: 8px; padding: 8px; margin: 0; font: 12px/1.45 var(--mono); color: var(--gold);
    min-height: 44px; max-height: 140px; overflow: auto; white-space: pre-wrap; }
  .ship pre.empty { color: #6f668f; }
  .ship .end { margin-top: 6px; font-size: 13px; color: var(--haze); }
  .moments { display: grid; gap: 8px; }
  .moment { background: rgba(35,29,63,.8); border-radius: 12px; padding: 10px 14px; font-size: 18px; }
  .moment.fresh { box-shadow: inset 0 0 0 2px var(--mint); }
  .moment time { display: block; color: var(--haze); font-size: 13px; }
  .empty { color: var(--haze); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<header>
  <div><h1>Class expedition</h1><p>Every star anyone earns fills the meter. Join at <b id="address"></b></p></div>
  <div class="total"><span id="count">0</span> ★<small>earned together</small></div>
</header>
<div class="meter" id="meter"><div class="fill" id="fill"></div></div>
<div class="unlock" id="unlock" hidden><b>🎉 Class unlock!</b><span id="unlockText"></span></div>
<main>
  <section><h2>The fleet</h2><div class="fleet" id="fleet"></div></section>
  <section><h2>Just now</h2><div class="moments" id="moments"></div></section>
</main>
<script src="/planet/render.js"></script>
<script>
const $ = id => document.getElementById(id);
const CALM = true;   // the projector's rovers stay still
// One colour for a rover's dot on the little maps.
function dotColor(paint) {
  const p = PAINTS[paint] || PAINTS.bone;
  return typeof p === "string" ? p : Array.isArray(p) ? p[0] : p.base || "#ff5ad8";
}
function esc(v) { return String(v).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch])); }
function ago(at) {
  const s = Math.max(0, Date.now() / 1000 - at);
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : `${Math.floor(s / 3600)} h ago`;
}
// Each student's site, as they see it, with their rover where it last stopped.
const GROUND = {"#": "#463c78", ".": "#2c2550", S: "#2c2550", "*": "#2c2550", G: "#2c2550", "~": "#5f86b8",
                O: "#120e22", "+": "#5a4a2a", P: "#2c2550", D: "#7a4f2a",
                ">": "#4a4658", "<": "#4a4658", "^": "#4a4658", v: "#4a4658", H: "#2f6b55"};
function miniMap(cv, map, pos, paint) {
  const rows = map.length, cols = map[0].length;
  const cell = Math.max(3, Math.min(14, Math.floor(246 / cols), Math.floor(150 / rows)));
  const dpr = devicePixelRatio || 1;
  cv.style.width = cols * cell + "px"; cv.style.height = rows * cell + "px";
  cv.width = cols * cell * dpr; cv.height = rows * cell * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const dot = (r, c, color, size) => { g.fillStyle = color; g.beginPath(); g.arc((c + .5) * cell, (r + .5) * cell, cell * size, 0, 7); g.fill(); };
  map.forEach((row, r) => [...row].forEach((ch, c) => {
    g.fillStyle = GROUND[ch] || GROUND["."]; g.fillRect(c * cell, r * cell, cell, cell);
    if (ch === "*") dot(r, c, "#ffb547", .22);
    if (ch === "G") dot(r, c, "#ffd36b", .38);
    if (ch === "P") dot(r, c, "#b9a3ff", .32);
    if (ch === "k") dot(r, c, "#ffd36b", .22);
    if (ch === "B") dot(r, c, "#a8a2b0", .4);
    if (ch >= "1" && ch <= "9") dot(r, c, "#ff6f61", .26);
  }));
  dot(pos[0], pos[1], "#120e22", .5);
  dot(pos[0], pos[1], dotColor(paint), .4);
}
const ENDS = {goal: "✓ mission complete", wrong: "wrong number", fell: "fell", battery: "flat battery",
              ticks: "out of time", stopped: "stopped short", error: "code error"};
// A little rover from above, in the student's own garage look, heading out.
function rover(cv, gear) {
  const dpr = devicePixelRatio || 1, s = 58;
  cv.width = s * dpr; cv.height = s * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  drawRover(g, s / 2, s / 2 + 4, 52, -.35, 1, gear, 0);
}
let seen = new Set(), lastFleet = "", lastTotal = null;
async function refresh() {
  let data;
  try { data = await (await fetch("/planet/overview")).json(); } catch (_) { return; }
  $("address").textContent = data.address.replace(/^http:\/\//, "");
  // One stage at a time: from the last goal reached to the next two, so the
  // meter visibly fills during a lesson however far the class has come.
  const total = data.class.stars, goals = data.class.goals, unlocks = data.class.unlocks || {};
  const done = goals.filter(g => total >= g), ahead = goals.filter(g => total < g).slice(0, 2);
  const from = done.length ? done[done.length - 1] : 0;
  const top = ahead.length ? ahead[ahead.length - 1] * 1.04 : Math.max(total, 1);
  const at = v => (from ? 6 : 0) + (v - from) / Math.max(1, top - from) * (from ? 94 : 100);
  $("fill").style.width = Math.min(100, at(total)) + "%";
  $("count").textContent = total;
  $("meter").querySelectorAll(".goal").forEach(g => g.remove());
  for (const goal of [...(from ? [from] : []), ...ahead]) {
    const el = document.createElement("div");
    el.className = "goal" + (total >= goal ? " done" : "");
    el.style.left = at(goal) + "%";
    el.innerHTML = `<span>${total >= goal ? "✓ " : ""}${goal} ★ unlocks ${esc(unlocks[goal] || "a surprise")}</span>`;
    // Near an end, the label lines up inward so it stays on screen.
    const span = el.firstChild, pos = at(goal);
    if (pos > 80) span.style.transform = "translateX(-100%)";
    else if (pos < 20) span.style.transform = "none";
    $("meter").appendChild(el);
  }
  // A goal crossed since the last look: the whole class sees it.
  const crossed = lastTotal == null ? [] : goals.filter(g => lastTotal < g && total >= g);
  lastTotal = total;
  if (crossed.length) {
    const g = crossed[crossed.length - 1];
    $("unlockText").textContent = `The class reached ${g} ★ together. Everyone unlocked ${unlocks[g] || "something new"}!`;
    $("unlock").hidden = false;
    clearTimeout(window.unlockTimer);
    window.unlockTimer = setTimeout(() => { $("unlock").hidden = true; }, 9000);
  }
  // By name, with no one's star count: this is a crew on the class screen,
  // not a ranking. The meter above is what the stars are for.
  // Each card: where they are, their map and rover, and the code in their editor.
  const ships = [...data.students].sort((a, b) => a.name.localeCompare(b.name));
  const fleet = JSON.stringify(ships.map(s => [s.name, s.look, s.now]));
  if (fleet !== lastFleet) {
    lastFleet = fleet;
    $("fleet").innerHTML = ships.length ? ships.map((s, i) => {
      const n = s.now, code = n.code.trim();
      const tag = n.site === "7" ? "Uncharted" : `${n.site.toUpperCase()} · ${n.site_name}`;
      return `<div class="ship${n.end === "goal" ? " won" : ""}">
        <div class="top"><canvas class="rv" data-i="${i}"></canvas><b>${esc(s.name)}</b><span class="where">${esc(tag)}</span></div>
        <canvas class="map" data-i="${i}"></canvas>
        <pre class="${code ? "" : "empty"}">${code ? esc(n.code) : "(no code yet)"}</pre>
        ${n.end ? `<div class="end">Last run: ${ENDS[n.end] || esc(n.end)}</div>` : ""}
      </div>`;
    }).join("") : '<p class="empty">Nobody has landed yet.</p>';
    $("fleet").querySelectorAll("canvas.rv").forEach(cv => rover(cv, ships[cv.dataset.i].look));
    $("fleet").querySelectorAll("canvas.map").forEach(cv => {
      const s = ships[cv.dataset.i];
      miniMap(cv, s.now.map, s.now.pos, s.look.paint);
    });
  }
  $("moments").innerHTML = data.feed.length ? [...data.feed].reverse().map(m => {
    const key = m.at + m.text, fresh = !seen.has(key);
    seen.add(key);
    return `<div class="moment${fresh && seen.size > data.feed.length ? " fresh" : ""}">${esc(m.text)}<time>${ago(m.at)}</time></div>`;
  }).join("") : '<p class="empty">First missions, records and three-star runs appear here.</p>';
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
